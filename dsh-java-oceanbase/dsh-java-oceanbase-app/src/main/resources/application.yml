server:
  port: 8093

spring:
  application:
    name: dsh-java-oceanbase
  jackson:
    default-property-inclusion: non_null

dsh:
  oceanbase:
    data-directory: ${user.home}/.dsh-java-oceanbase
    query-timeout-seconds: 15
    max-rows: 500
    harness:
      base-url: ${DSH_HARNESS_BASE_URL:http://127.0.0.1:8090}
